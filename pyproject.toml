[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-wake-coupling"
version = "3.0.0"
description = "First-principles field-theoretic N-body wake coupling research framework"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Research Artifact"}
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
